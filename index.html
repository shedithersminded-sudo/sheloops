<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHELOOPS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0e10">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<script>
// self update: when a new version is out, swap every saved file for the new one, then reload once
(async () => { try {
  const j = await fetch('version.json', { cache: 'no-store' }).then(r => r.json()), had = localStorage.getItem('sheloops.ver');
  if (!j.version || had === j.version) return;
  localStorage.setItem('sheloops.ver', j.version);
  if (!had) return;
  if (window.caches) for (const k of await caches.keys()) if (k.startsWith('sheloops-')) await caches.delete(k);
  await Promise.all((j.files || ['index.html', 'style.css']).map(f => fetch(f, { cache: 'reload' }).catch(() => { })));
  location.reload();
} catch { } })();
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="intro-cover"></div>
<script>try { var L = JSON.parse(localStorage.getItem('loopden.look') || '{}'); if (L.intro && L.intro.on === false) document.getElementById('intro-cover').remove(); } catch (e) { }</script>
<header id="nav" class="topnav"></header>
<main id="view"></main>
<footer id="foot" class="panel master" hidden></footer>
<div id="toast"></div>
</body>
</html>
